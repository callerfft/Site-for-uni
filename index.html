<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>poFactu</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #fff;
            color: #000;
            overflow-x: hidden;
            transition: background 0.3s ease, color 0.3s ease;
        }

        body.dark {
            background: #1a1a1a;
            color: #e0e0e0;
        }

        /* ===== НАВИГАЦИЯ (стиль Яндекса) ===== */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            z-index: 1000;
            border-bottom: 1px solid #e0e0e0;
            opacity: 0;
            transition: opacity 0.5s ease, background 0.3s ease, border-color 0.3s ease;
        }

        body.dark nav {
            background: #1a1a1a;
            border-bottom-color: #333;
        }

        nav.visible {
            opacity: 1;
        }

        .nav-logo {
            font-size: 1.6rem;
            font-weight: 700;
            color: #000;
            text-decoration: none;
            letter-spacing: -0.02em;
            transition: color 0.3s ease;
        }

        body.dark .nav-logo {
            color: #e0e0e0;
        }

        .nav-logo span {
            color: #fc0;
        }

        .nav-links {
            display: flex;
            gap: 24px;
            align-items: center;
        }

        .nav-links a {
            color: #000;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.3s ease, opacity 0.2s ease;
        }

        body.dark .nav-links a {
            color: #e0e0e0;
        }

        .nav-links a:hover {
            opacity: 0.6;
        }

        .nav-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: opacity 0.2s ease;
            overflow: hidden;
        }

        .nav-avatar:hover {
            opacity: 0.8;
        }

        .nav-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .nav-avatar-placeholder {
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            user-select: none;
        }

        /* ===== КНОПКА ТЕМЫ ===== */
        .theme-toggle {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s ease;
        }

        .theme-toggle:hover {
            background: rgba(0, 0, 0, 0.05);
        }

        body.dark .theme-toggle:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .theme-toggle svg {
            width: 20px;
            height: 20px;
            fill: #000;
            transition: fill 0.3s ease;
        }

        body.dark .theme-toggle svg {
            fill: #e0e0e0;
        }

        .theme-toggle .sun-icon {
            display: none;
        }

        .theme-toggle .moon-icon {
            display: block;
        }

        body.dark .theme-toggle .sun-icon {
            display: block;
        }

        body.dark .theme-toggle .moon-icon {
            display: none;
        }

        /* ===== ПРИВЕТСТВИЕ (плавное исчезновение) ===== */
        #intro {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 2000;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        #intro.fade-out {
            opacity: 0;
            visibility: hidden;
        }

        #intro h1 {
            font-size: 4rem;
            color: #fff;
            margin-bottom: 1rem;
            letter-spacing: -0.02em;
            animation: introFadeIn 1s ease-out;
        }

        #intro p {
            font-size: 1.5rem;
            color: rgba(255, 255, 255, 0.6);
            animation: introFadeIn 1s ease-out 0.3s both;
        }

        @keyframes introFadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== ОСНОВНОЙ КОНТЕНТ ===== */
        main {
            padding-top: 60px;
        }

        section {
            padding: 60px 24px;
            max-width: 1200px;
            margin: 0 auto;
        }

        section h2 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 32px;
            letter-spacing: -0.02em;
        }

        body.dark section h2 {
            color: #e0e0e0;
        }

        /* ===== ВКЛАДКИ (табы как у Яндекса) ===== */
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 32px;
            border-bottom: 1px solid #e0e0e0;
            padding-bottom: 0;
        }

        body.dark .tabs {
            border-bottom-color: #333;
        }

        .tab {
            padding: 12px 20px;
            font-size: 0.95rem;
            font-weight: 500;
            color: #666;
            cursor: pointer;
            border: none;
            background: none;
            border-bottom: 2px solid transparent;
            transition: color 0.2s ease, border-color 0.2s ease;
        }

        .tab:hover {
            color: #000;
        }

        body.dark .tab {
            color: #999;
        }

        body.dark .tab:hover {
            color: #e0e0e0;
        }

        .tab.active {
            color: #000;
            border-bottom-color: #fc0;
        }

        body.dark .tab.active {
            color: #e0e0e0;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* ===== ВИДЕО ===== */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 24px;
        }

        .video-card {
            background: #f5f5f5;
            border-radius: 16px;
            overflow: hidden;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.3s ease;
        }

        body.dark .video-card {
            background: #2a2a2a;
        }

        .video-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
        }

        body.dark .video-card:hover {
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            background: #000;
        }

        .video-wrapper video,
        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .video-title {
            padding: 16px;
            font-size: 0.95rem;
            font-weight: 500;
        }

        /* ===== ФОТО ===== */
        .photo-container {
            overflow: hidden;
            width: 100%;
            position: relative;
            padding-bottom: 20px;
        }

        .photo-grid {
            display: flex;
            gap: 16px;
            width: max-content;
            animation: scroll-photos 20s linear infinite;
        }

        .photo-grid:hover {
            animation-play-state: paused;
        }

        @keyframes scroll-photos {
            0% {
                transform: translateX(0);
            }

            100% {
                transform: translateX(calc(-50% - 8px));
            }
        }

        .photo-card {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            width: 250px;
            height: 250px;
            flex-shrink: 0;
            cursor: pointer;
            background: #f5f5f5;
            transition: background 0.3s ease;
        }

        body.dark .photo-card {
            background: #2a2a2a;
        }

        .photo-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .photo-card:hover img {
            transform: scale(1.05);
        }

        .photo-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 16px;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.7));
            color: #fff;
            font-size: 0.9rem;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .photo-card:hover .photo-overlay {
            opacity: 1;
        }

        /* ===== ЗАГРУЗКА ФОТО ===== */
        .upload-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 2px dashed #d0d0d0;
            border-radius: 16px;
            padding: 32px;
            cursor: pointer;
            transition: border-color 0.2s ease, background 0.2s ease;
            aspect-ratio: 1 / 1;
            background: #fafafa;
        }

        body.dark .upload-area {
            background: #222;
            border-color: #444;
        }

        .upload-area:hover {
            border-color: #fc0;
            background: #fffdf0;
        }

        body.dark .upload-area:hover {
            border-color: #fc0;
            background: #2a2a20;
        }

        .upload-area svg {
            width: 48px;
            height: 48px;
            margin-bottom: 12px;
            fill: #999;
        }

        .upload-area p {
            font-size: 0.9rem;
            color: #999;
            text-align: center;
        }

        .upload-area input {
            display: none;
        }

        /* ===== О НАС ===== */
        .about-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            align-items: start;
        }

        .member-card {
            background: #f5f5f5;
            border-radius: 16px;
            padding: 24px;
            transition: background 0.3s ease, transform 0.2s ease, box-shadow 0.2s ease;
        }

        body.dark .member-card {
            background: #2a2a2a;
        }

        .member-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
        }

        body.dark .member-card:hover {
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        .member-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 16px;
        }

        .member-short {
            font-size: 0.95rem;
            color: #555;
            transition: color 0.3s ease;
        }

        body.dark .member-short {
            color: #aaa;
        }

        .member-desc-full {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: max-height 0.4s ease, opacity 0.4s ease, margin-top 0.4s ease;
            font-size: 0.9rem;
            color: #444;
            line-height: 1.5;
        }

        body.dark .member-desc-full {
            color: #bbb;
        }

        .member-card:hover .member-desc-full {
            max-height: 300px;
            opacity: 1;
            margin-top: 16px;
        }

        .member-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: 700;
            color: #fc0;
            flex-shrink: 0;
            overflow: hidden;
            transition: background 0.3s ease, color 0.3s ease;
        }

        body.dark .member-avatar {
            background: #fc0;
            color: #000;
        }

        .member-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .member-name {
            font-size: 1.1rem;
            font-weight: 700;
            color: #000;
            transition: color 0.3s ease;
        }

        body.dark .member-name {
            color: #e0e0e0;
        }

        .member-role {
            font-size: 0.85rem;
            color: #666;
            margin-top: 2px;
            transition: color 0.3s ease;
        }

        body.dark .member-role {
            color: #999;
        }

        .member-tasks {
            list-style: none;
            padding: 0;
        }

        .member-tasks li {
            padding: 8px 0;
            border-bottom: 1px solid #e0e0e0;
            font-size: 0.9rem;
            color: #333;
            transition: border-color 0.3s ease, color 0.3s ease;
        }

        body.dark .member-tasks li {
            border-bottom-color: #444;
            color: #ccc;
        }

        .member-tasks li:last-child {
            border-bottom: none;
        }

        .member-tasks li::before {
            content: '→ ';
            color: #fc0;
            font-weight: 700;
        }

        /* ===== ФУТЕР ===== */
        footer {
            text-align: center;
            padding: 32px 24px;
            background: #f5f5f5;
            font-size: 0.85rem;
            color: #999;
            margin-top: 40px;
            transition: background 0.3s ease, color 0.3s ease;
        }

        body.dark footer {
            background: #222;
            color: #666;
        }

        /* ===== АДАПТИВ ===== */
        @media (max-width: 768px) {
            #intro h1 {
                font-size: 2.5rem;
            }

            #intro p {
                font-size: 1.1rem;
            }

            nav {
                padding: 0 16px;
            }

            .nav-links {
                gap: 16px;
            }

            .nav-links a {
                font-size: 0.85rem;
            }

            section {
                padding: 40px 16px;
            }

            section h2 {
                font-size: 1.5rem;
            }

            .video-grid {
                grid-template-columns: 1fr;
            }

            .photo-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            }

            .tabs {
                overflow-x: auto;
            }
        }
    </style>
</head>

    <script>
        // ╔══════════════════════════════════════════════════════════╗
        // ║          INSERT VIDEO URLS HERE                         ║
        // ╚══════════════════════════════════════════════════════════╝
        //
        // Format: { url: "link", title: "title" }
        //
        // Supported:
        //  1. Direct links to .mp4 / .webm
        //  2. YouTube — normal link or embed
        //  3. Vimeo and other platforms
        //
        const VIDEO_URLS = [
            { url: "https://youtu.be/VEu4-7N1Qvk?si=RTGrrB6VdHS2eBUL", title: "Our first video" },
            { url: "https://youtu.be/yEI4RkNEsRM?si=2nr28ffPupMZcA0R", title: "from coin to NFC" },
            { url: "https://youtu.be/d1frUpTzgZs?si=JmMHr03AGtVXXiG-", title: "tested" },
            // { url: "https://www.youtube.com/watch?v=XXXXXXXX", title: "YouTube video" },
            // Add new lines here separated by commas
        ];

        // Determines video type by URL
        function getVideoType(url) {
            if (url.includes('youtube.com') || url.includes('youtu.be')) return 'youtube';
            if (url.includes('vimeo.com')) return 'vimeo';
            if (url.match(/\.(mp4|webm|ogg)(\?.*)?$/i)) return 'direct';
            return 'direct';
        }

        // Gets embed URL from a regular YouTube link
        function getEmbedUrl(url) {
            // YouTube
            const ytMatch = url.match(/[?&]v=([a-zA-Z0-9_-]+)/);
            const ytShort = url.match(/youtu\.be\/([a-zA-Z0-9_-]+)/);
            if (ytShort) return `https://www.youtube.com/embed/${ytShort[1]}`;
            if (ytMatch) return `https://www.youtube.com/embed/${ytMatch[1]}`;
            // Уже embed
            if (url.includes('/embed/')) return url;
            return url;
        }

        // Рендерит видео-карточки
        function renderVideos() {
            const grid = document.getElementById('video-grid');
            grid.innerHTML = '';

            VIDEO_URLS.forEach((video, index) => {
                const card = document.createElement('div');
                card.className = 'video-card';

                const type = getVideoType(video.url);
                let videoHTML = '';

                if (type === 'youtube') {
                    const embedUrl = getEmbedUrl(video.url);
                    videoHTML = `<div class="video-wrapper">
                        <iframe src="${embedUrl}" allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>
                    </div>`;
                } else {
                    videoHTML = `<div class="video-wrapper">
                        <video controls>
                            <source src="${video.url}" type="video/mp4">
                        </video>
                    </div>`;
                }

                card.innerHTML = `
                    ${videoHTML}
                    <div class="video-title">${video.title}</div>
                `;

                grid.appendChild(card);
            });

            // Appearance animation
            observeCards();
        }

        // Renders photo cards from array
        function renderPhotos() {
            const grid = document.querySelector('#photos .photo-grid');
            const uploadArea = grid.querySelector('.upload-area');

            PHOTO_URLS.forEach(photo => {
                const card = document.createElement('div');
                card.className = 'photo-card';
                card.innerHTML = `
                    <img src="${photo.url}" alt="${photo.alt}">
                    <div class="photo-overlay">${photo.alt}</div>
                `;
                grid.insertBefore(card, uploadArea);
            });

            // Appearance animation
            observeCards();
        }

        // Renders team members
        function renderTeam() {
            const grid = document.getElementById('about-grid');
            if (!grid) return;
            grid.innerHTML = '';

            TEAM_MEMBERS.forEach(member => {
                const card = document.createElement('div');
                card.className = 'member-card';

                const initial = member.name ? member.name.charAt(0).toUpperCase() : '?';
                const avatarHTML = member.avatar
                    ? `<div class="member-avatar"><img src="${member.avatar}" alt="${member.name}"></div>`
                    : `<div class="member-avatar">${initial}</div>`;

                card.innerHTML = `
                    <div class="member-header">
                        ${avatarHTML}
                        <div>
                            <div class="member-name">${member.name}</div>
                            <div class="member-role">${member.role}</div>
                        </div>
                    </div>
                    <div class="member-short">${member.shortDesc}</div>
                    <div class="member-desc-full">${member.longDesc}</div>

        // ╔══════════════════════════════════════════════════════════╗
        // ║          CUSTOM TABS SYSTEM                            ║
        // ╚══════════════════════════════════════════════════════════╝
        // You can easily add custom tabs here
        const CUSTOM_TABS = [
            // Example custom tab:
            // {
            //     id: "custom1",

        ];

        function renderCustomTabs() {
            const tabsContainer = document.getElementById('tabs-container');
            const mainSection = document.getElementById('main-section');

            CUSTOM_TABS.forEach(tabData => {
                // Add tab button
                const btn = document.createElement('button');
                btn.className = 'tab';
                btn.dataset.tab = tabData.id;
                btn.textContent = tabData.title;
                tabsContainer.appendChild(btn);

                // Add tab content
                const contentDiv = document.createElement('div');
                contentDiv.className = 'tab-content';
                contentDiv.id = tabData.id;
                contentDiv.innerHTML = tabData.content;
                mainSection.appendChild(contentDiv);
            });
        }

        // ===== APPEARANCE ANIMATION ON SCROLL =====
        function observeCards() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.style.opacity = '1';
                        entry.target.style.transform = 'translateY(0)';
                    }
                });
            }, { threshold: 0.1 });

            document.querySelectorAll('.video-card, .photo-card, .member-card').forEach(card => {
                if (card.style.opacity === '') {
                    card.style.opacity = '0';
                    card.style.transform = 'translateY(20px)';
                    card.style.transition = 'opacity 0.5s ease, transform 0.5s ease';
                    observer.observe(card);
                }
            });
        }

        // ===== WELCOME: fade out after 2.5 seconds =====
        setTimeout(() => {
            document.getElementById('intro').classList.add('fade-out');
            document.getElementById('navbar').classList.add('visible');
        }, 2500);

        // ===== THEME TOGGLE =====
        const themeToggle = document.getElementById('theme-toggle');
        const body = document.body;

        // Check saved theme
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            body.classList.add('dark');
        }

        themeToggle.addEventListener('click', () => {
            body.classList.toggle('dark');
            localStorage.setItem('theme', body.classList.contains('dark') ? 'dark' : 'light');
        });

        // ===== TABS =====
        document.getElementById('tabs-container').addEventListener('click', function (e) {
            if (e.target.classList.contains('tab')) {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

                e.target.classList.add('active');
                document.getElementById(e.target.dataset.tab).classList.add('active');
            }
        });

        // ===== UPLOAD LOCAL PHOTOS =====
        const photoUpload = document.getElementById('photo-upload');
        if (photoUpload) {
            photoUpload.addEventListener('change', function (e) {
                const files = e.target.files;
                const photoGrid = document.querySelector('#photos .photo-grid');
                const uploadArea = photoGrid.querySelector('.upload-area');

                Array.from(files).forEach(file => {
                    if (file.type.startsWith('image/')) {
                        const reader = new FileReader();
                        reader.onload = function (event) {
                            const photoCard = document.createElement('div');
                            photoCard.className = 'photo-card';
                            photoCard.innerHTML = `
                                <img src="${event.target.result}" alt="${file.name}">
                                <div class="photo-overlay">${file.name}</div>
                            `;
                            photoGrid.insertBefore(photoCard, uploadArea);
                        };
                        reader.readAsDataURL(file);
                    }
                });

                this.value = '';
            });
        }

        // Start rendering
        renderCustomTabs();
        renderVideos();
        renderPhotos();
        renderTeam();
    </script>
